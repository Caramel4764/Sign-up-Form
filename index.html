<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-up Form</title>
  <link rel="stylesheet" href="./style.css" >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>
  <div class="wholepage">
    <div class="image-div">
      <div class="image-crop">
        <img src="./road-bg.jpg" alt="a winding road with a pine forest background">
      </div>
      <div class="odin-icon-div">
        <div class="img-div-icon-odin"><img src="./odin-icon.png" alt="icon of odin"></div>
        <p>Odin</p>
      </div>
      <div class="credit-div">
        <p class="credit">Photo by <a href="https://unsplash.com/@filipz?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash">Filip Zrnzević</a> on <a href="https://unsplash.com/photos/green-leafed-trees-during-daytime-_EMkxLdko9k?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash">Unsplash</a></p>
      </div>
    </div>
    <div class="center-div">
      <div class="text-div">
        <h2 class="login">Sign Up</h2>
        <form>
          <fieldset class="field-input">
            <div class="form-div">
              <div class="label-div">
                <label for="f-name">
                  First Name
                </label>
                <input type="text" id="f-name">
              </div>
              <div class="label-div">
                <label for="l-name">
                  Last Name
                </label>
                <input type="text" id="l-name">
              </div>
              <div class="label-div">
                <label for="email">
                  Email
                </label>
                <input type="text" id="email">
              </div>
              <div class="label-div">
                <label for="phone-num">
                  Phone Number
                </label>
                <input type="text" id="phone-num">
              </div>
              <div class="label-div">
                <label for="l-name">
                  Password
                </label>
                <input type="text" id="l-name">
              </div>
              <div class="label-div">
                <label for="l-name">
                  Confirm Password
                </label>
                <input type="text" id="l-name">
              </div>
            </div>
          </fieldset>
          <div class="form-footer">
            <button type="submit" id="submit">Create Account</button>
            <p>Already have an account? <a href="#">Log in</a></p>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
